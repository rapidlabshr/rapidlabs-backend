<!DOCTYPE html>
<html>
<head>
<title>Upload Reports</title>

<style>
body{
    font-family:Arial;
    background:linear-gradient(135deg,#eef2f7,#dfe9f3);
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* MAIN CARD */
.form-box{
    background:white;
    padding:30px 25px;
    border-radius:12px;
    width:380px;
    box-shadow:0 8px 25px rgba(0,0,0,0.15);
    text-align:center;
}

/* TITLE */
h2{
    margin-bottom:20px;
    color:#0f3f7a;
}

/* INPUTS */
input,select{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:14px;
    transition:0.2s;
}

input:focus,select:focus{
    border-color:#0f3f7a;
    outline:none;
    box-shadow:0 0 4px rgba(15,63,122,0.3);
}

/* BUTTON */
button{
    background:linear-gradient(135deg,#0f3f7a,#0c2f5c);
    color:white;
    padding:12px;
    border:none;
    width:100%;
    border-radius:6px;
    cursor:pointer;
    font-weight:600;
    transition:0.2s;
}

button:hover{
    transform:translateY(-1px);
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

/* FILE INPUT STYLE */
input[type="file"]{
    background:#f9fbff;
}
</style>
</head>

<body>

<div class="main">

<h2>Upload Report</h2>

<div class="form-box">

<select id="client_id">
<option value="">Select Client</option>
</select>

<input type="text" id="patient_name" placeholder="Patient Name">

<input type="text" id="test_name" placeholder="Test Name">

<input type="text" id="mobile" placeholder="Mobile Number"> 


<input type="file" id="file">

<button onclick="upload()">Upload Report</button>

</div>

</div>

<script>

// load clients
async function loadClients(){
    const res = await fetch("/api/clients")
    const data = await res.json()

    const select = document.getElementById("client_id")

    data.forEach(c=>{
        select.innerHTML += `<option value="${c.id}">${c.name}</option>`
    })
}

loadClients()

// upload
async function upload(){

    const client = document.getElementById("client_id").value
    const patient = document.getElementById("patient_name").value
    const test = document.getElementById("test_name").value
    const mobile = document.getElementById("mobile").value

    const file = document.getElementById("file").files[0]

    if(!client || !patient || !test || !mobile || !file){
        alert("Fill all fields")
        return
    }

    const form = new FormData()   // ✅ IMPORTANT

    const numericId = client.replace("RPDLB","")

    form.append("client_id", numericId)
    form.append("patient_name", patient)
    form.append("test_name", test)
    form.append("mobile", mobile) 
    form.append("file", file)

    const res = await fetch("http://127.0.0.1:5000/upload-report-new",{
        method:"POST",
        body:form
    })

    const data = await res.json()

    if(data.success){
        alert("Uploaded successfully")

        localStorage.setItem("refresh_reports", Date.now())
    }else{
        alert("Upload failed: " + (data.error || "Unknown error"))
    }
}
</script>

</body>
</html>
