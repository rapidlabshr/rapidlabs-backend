<!DOCTYPE html>
<html>
<head>

<title>Rapid Labs - Leads</title>

<link rel="stylesheet" href="/static/style.css">

<style>
:root{
    --primary:#0f3f7a;
    --primary-dark:#0b2f5a;

    --bg:#f5f7fa;
    --card:#ffffff;

    --text:#111827;
    --muted:#6b7280;

    --border:#e5e7eb;
    --border-dark:#d1d5db;

    --success:#166534;
    --danger:#b91c1c;

    --radius:10px;
    --shadow:0 2px 8px rgba(15,23,42,.06);
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--bg);
    font-family:"Segoe UI",Arial,sans-serif;
    color:var(--text);
    font-size:14px;
}

.main{
    margin-left:220px;
    padding:20px;
    min-height:100vh;
}

.main h1{
    margin:0 0 16px;
    font-size:22px;
    font-weight:800;
    color:var(--text);
}

.table-container{
    background:var(--card);
    padding:14px;
    border-radius:var(--radius);
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1100px;
    font-size:13px;
}

th,
td{
    padding:10px 12px;
    border-bottom:1px solid var(--border);
    text-align:left;
    vertical-align:middle;
    white-space:nowrap;
}

th{
    background:#f3f4f6;
    color:#000;
    font-size:12px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:.3px;
    position:sticky;
    top:0;
    z-index:2;
    border-bottom:1px solid var(--border-dark);
}

td{
    color:#111827;
    font-weight:600;
}

tbody tr:hover td{
    background:#fafafa;
}

select{
    height:32px;
    padding:0 10px;
    border-radius:7px;
    border:1px solid var(--border-dark);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    background:white;
    color:#111827;
    min-width:110px;
}

select:focus{
    outline:none;
    border-color:var(--primary);
}

.payment-paid{
    color:var(--success);
    font-weight:800;
}

.payment-unpaid{
    color:var(--danger);
    font-weight:800;
}

@media(max-width:900px){
    .main{
        margin-left:0;
        padding:14px;
    }

    .table-container{
        padding:10px;
    }

    table{
        min-width:1000px;
    }
}
</style>
</head>


<body>


<!-- SIDEBAR -->

<div class="sidebar">

<h2>Rapid Labs</h2>

<ul>
<li onclick="goDashboard()">Dashboard</li>
<li style="background:#0f3f7a;">Leads</li>
<li onclick="openCollection()">Sample Collection</li>
<li onclick="openReports()">Reports</li>
<li onclick="openPayments()">Payments</li>
<li onclick="openAccounts()">Accounts</li>
<li onclick="openStaff()">Staff</li>
</ul>

</div>



<!-- MAIN CONTENT -->

<div class="main">

<h1>Leads</h1>

<div class="table-container">

<table id="leadsTable">

<thead>

<tr>
<th>ID</th>
<th>Name</th>
<th>Mobile</th>
<th>Test</th>
<th>Location</th>
<th>Pincode</th>
<th>Cost</th>
<th>Status</th>
<th>Payment</th>
<th>Date</th>
<th>Sample Date</th>
<th>Sample Time</th>
</tr>

</thead>

<tbody>

</tbody>

</table>

</div>

</div>



<script>

/* ================= DASHBOARD NAVIGATION ================= */

function goDashboard(){
window.location.href="/dashboard";
}

function openCollection(){
window.location.href="/sample-collection?role=admin";
}

function openReports(){
window.location.href="/reports";
}

function openPayments(){
window.location.href="/payments";
}

function openAccounts(){
window.location.href="/accounts";
}

function openStaff(){
window.location.href="/staff";
}


/* ================= UPDATE STATUS ================= */

async function updateStatus(id,newStatus){

await fetch("/api/update-lead-status",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
id:id,
status:newStatus
})

});

}



/* ================= UPDATE PAYMENT ================= */

async function updatePayment(id,newPayment){

await fetch("/api/update-payment-status",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
id:id,
payment_status:newPayment
})

});

}



/* ================= LOAD LEADS ================= */

async function loadLeads(){

try{

const res = await fetch("/api/leads");

const leads = await res.json();

const table = document.querySelector("#leadsTable tbody");

table.innerHTML="";

leads.forEach(lead=>{

const row=document.createElement("tr");

row.innerHTML = `

<td>${lead.id}</td>

<td>${lead.name}</td>

<td>${lead.mobile_number}</td>

<td>${lead.test_name}</td>

<td>${lead.location}</td>

<td>${lead.pincode || ""}</td>

<td style="font-weight:bold;color:#0f3f7a;">
₹ ${lead.amount || 0}
</td>

<td>
<select onchange="updateStatus(${lead.id},this.value)">
<option value="new" ${lead.status==="new"?"selected":""}>New</option>
<option value="ongoing" ${lead.status==="ongoing"?"selected":""}>Ongoing</option>
<option value="completed" ${lead.status==="completed"?"selected":""}>Completed</option>
</select>
</td>

<td style="font-weight:bold; color:${lead.payment === "Paid" ? "green" : "red"};">
${lead.payment || "Not Paid"}
</td>

<td>
${lead.created_at ? new Date(lead.created_at).toLocaleString() : "-"}
</td>

<td>${lead.sample_date || "-"}</td>

<td>${lead.sample_time || "-"}</td>

`;

table.appendChild(row);

});

}catch(err){

console.error("Error loading leads",err);

}

}



/* ================= LOAD ON PAGE OPEN ================= */

loadLeads();

/* AUTO REFRESH ADMIN LEADS EVERY 3 SECONDS */


</script>


</body>
</html>
