<!DOCTYPE html>
<html>

<head>

<title>Rapid Labs Billing</title>

<link rel="stylesheet" href="/static/style.css">

<style>
:root{
    --primary:#0f3f7a;
    --primary-dark:#0b2f5a;

    --bg:#f5f7fb;
    --card:#ffffff;

    --text:#111827;
    --muted:#6b7280;

    --border:#e5e7eb;

    --shadow:
        0 1px 3px rgba(15,23,42,.05),
        0 8px 20px rgba(15,23,42,.04);

    --radius:10px;
}

/* =========================
   GLOBAL
========================= */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Segoe UI",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:220px;
    height:100vh;

    position:fixed;
    left:0;
    top:0;

    background:#ffffff;

    border-right:1px solid var(--border);

    overflow-y:auto;

    z-index:1000;
}

/* LOGO */

.sidebar h2{
    margin:0;

    height:64px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;
    font-weight:800;

    color:var(--primary);

    border-bottom:1px solid var(--border);

    letter-spacing:.3px;
}

/* MENU */

.sidebar ul{
    list-style:none;
    padding:10px;
    margin:0;
}

.sidebar ul li{
    display:flex;
    align-items:center;

    min-height:44px;

    padding:0 14px;

    margin-bottom:4px;

    border-radius:8px;

    cursor:pointer;

    font-size:14px;
    font-weight:600;

    color:#374151;

    transition:.16s ease;
}

.sidebar ul li:hover{
    background:#f3f6fb;
    color:var(--primary);
}

/* ACTIVE */

.sidebar ul li.active{
    background:#eef4ff;
    color:var(--primary);
    font-weight:700;
}

/* =========================
   DROPDOWN
========================= */

.dropdown-content{
    display:none;

    margin-top:4px;
    margin-bottom:8px;

    padding-left:8px;
}

.dropdown-content li{
    min-height:38px;

    font-size:13px;
    font-weight:600;

    color:#6b7280;

    padding-left:18px;

    border-radius:7px;
}

.dropdown-content li:hover{
    background:#f5f7fb;
    color:var(--primary);
}

/* =========================
   MAIN
========================= */

.main{
    margin-left:220px;
    padding:20px;
}

/* =========================
   SECTION / CARD
========================= */

.section{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:var(--radius);

    padding:18px;

    box-shadow:var(--shadow);
}

/* SECTION TITLE */

.section h3{
    margin-top:0;
    margin-bottom:16px;

    font-size:18px;
    font-weight:800;

    color:#111827;
}

/* =========================
   TABLES
========================= */

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#f9fafb;

    padding:10px 12px;

    text-align:left;

    font-size:12px;
    font-weight:800;

    color:#000;

    text-transform:uppercase;
    letter-spacing:.3px;

    border-bottom:1px solid #dbe2ea;
}

td{
    padding:10px 12px;

    border-bottom:1px solid #edf2f7;

    color:#111827;

    font-weight:600;
}

tbody tr:hover td{
    background:#fafcff;
}

/* =========================
   INPUTS
========================= */

input,
select,
textarea{
    width:100%;

    border:1px solid #d1d5db;

    border-radius:8px;

    padding:10px 12px;

    font-size:14px;

    background:white;

    color:#111827;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:var(--primary);
}

/* =========================
   BUTTONS
========================= */

button{
    border:none;

    border-radius:8px;

    padding:10px 16px;

    background:var(--primary);

    color:white;

    font-size:13px;
    font-weight:700;

    cursor:pointer;

    transition:.15s ease;
}

button:hover{
    background:var(--primary-dark);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    .sidebar{
        width:100%;
        height:auto;
        position:relative;
    }

    .main{
        margin-left:0;
        padding:14px;
    }
}
</style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

<h2>Rapid Labs</h2>

<ul>

<li onclick="goDashboard()">Dashboard</li>

<li onclick="goLeads()">My Leads</li>

<li onclick="goSample()">Sample Collection</li>

<li onclick="goReports()">Reports</li>

<li onclick="goBilling()">Billing</li>

</ul>

<li onclick="logout()">Logout</li>

</ul>

</div>


<!-- MAIN CONTENT -->

<div class="main">

<h1 id="pageTitle">Billing</h1>

<div class="section" id="contentArea">

<h3>Create Bill</h3>


</div>

</div>


<script>

/* NAVIGATION */

function goDashboard(){
window.location.href="/staff-dashboard";
}

function goLeads(){
window.location.href="/staff-leads";
}

function goSample(){
window.location.href="/sample-collection";
}

function goReports(){
window.location.href="/staff-reports";
}

function logout(){
localStorage.removeItem("user");
window.location.href="/";
}

function goReports(){
window.location.href="/staff-reports";
}


function goBilling(){
window.location.href="/create-bill";
}
</script>

</body>
</html>
